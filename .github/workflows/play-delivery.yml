name: Play delivery
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: play-publishing
  cancel-in-progress: false
  queue: max
env:
  FASTLANE_OPT_OUT_USAGE: '1'
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_ENV_VALUES: 'true'
  BUNDLE_FROZEN: 'true'
jobs:
  publish:
    if: >-
      github.repository == 'centerionware/Clockrove' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source eligibility and pinned release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_READY: ${{ vars.PRODUCTION_READY }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$PRODUCTION_READY" = true || { echo 'Production readiness/testing eligibility is not enabled.'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs?head_sha=$SOURCE_SHA&status=success" --jq '.workflow_runs[] | select(.head_branch == "main" and .event == "push") | .id' > "$RUNNER_TEMP/eligible-runs"
            test -s "$RUNNER_TEMP/eligible-runs" || { echo 'No successful main validation exists for this tag commit.'; exit 1; }
            echo 'track=production' >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo 'track=internal' >> "$GITHUB_OUTPUT"
          fi
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4 # v1.207.0
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.23'
      - name: Install locked publishing tools and test version policy
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec ruby test/release_version_test.rb
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - name: Install verified Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/clockrove-android-sdk"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/19.0"
          sdkmanager="$sdk_root/cmdline-tools/19.0/bin/sdkmanager"
          # yes may receive SIGPIPE after sdkmanager finishes reading licenses.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          license_result=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_result" -eq 0
          "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Prepare signing and Play credentials
        env:
          STORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          ACCOUNT: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$STORE" && test -n "$ACCOUNT" || { echo 'Publishing credentials missing'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/play-secrets"
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/play-secrets/upload.p12"
          printf '%s' "$ACCOUNT" > "$RUNNER_TEMP/play-secrets/account.json"
          echo "PLAY_SERVICE_ACCOUNT_FILE=$RUNNER_TEMP/play-secrets/account.json" >> "$GITHUB_ENV"
          echo "CLOCKROVE_UPLOAD_KEYSTORE=$RUNNER_TEMP/play-secrets/upload.p12" >> "$GITHUB_ENV"
      - name: Allocate unique increasing versionCode from Play history
        id: code
        run: bundle exec fastlane allocate_code
      - name: Select automatic versionName
        id: name
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PLAY_TRACK: ${{ steps.release.outputs.track }}
        run: |
          bundle exec ruby -r ./fastlane/versioning -e 'base=File.read("pubspec.yaml").match(/^version: (.+)$/)[1].split("+")[0]; name=ENV["PLAY_TRACK"] == "production" ? ClockroveVersioning.production_name(ENV.fetch("RELEASE_TAG")) : ClockroveVersioning.internal_name(base,ENV.fetch("GITHUB_RUN_NUMBER"),ENV.fetch("GITHUB_RUN_ATTEMPT")); File.open(ENV.fetch("GITHUB_OUTPUT"),"a") { |f| f.puts("name=#{name}") }'
      - name: Build with permanent upload key
        env:
          CLOCKROVE_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          CLOCKROVE_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          CLOCKROVE_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          BUILD_NAME: ${{ steps.name.outputs.name }}
          BUILD_CODE: ${{ steps.code.outputs.code }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build appbundle --release --no-pub --build-name="$BUILD_NAME" --build-number="$BUILD_CODE"
          jarsigner -verify -strict -keystore "$CLOCKROVE_UPLOAD_KEYSTORE" -storepass:env CLOCKROVE_UPLOAD_STORE_PASSWORD build/app/outputs/bundle/release/app-release.aab
      - name: Upload and submit selected Play track
        env:
          PLAY_TRACK: ${{ steps.release.outputs.track }}
        run: |
          bundle exec fastlane deliver_play
          echo "Play upload/submission accepted. Approval and live/tester availability require separate Play evidence." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/play-secrets"
