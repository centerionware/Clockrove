name: Deploy documentation site

# Publishes the static site in website/ to Cloudflare Pages. The site has no build
# step: the directory is uploaded as-is, including legal/, and Cloudflare serves it
# from its edge cache using the headers in website/_headers.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/check-documentation-links.py'
      - 'scripts/check-website-deploy.py'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    # Forks never deploy. The owner supplies the credentials as repository secrets;
    # without them this job validates the site and reports that publishing is skipped.
    if: github.repository == 'centerionware/Clockrove'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: website
      url: ${{ vars.CLOCKROVE_SITE_URL || 'https://clockrove.pages.dev' }}
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'clockrove' }}
      SITE_URL: ${{ vars.CLOCKROVE_SITE_URL || 'https://clockrove.pages.dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate the published pages and deployment files
        run: |
          python3 scripts/check-documentation-links.py
          python3 scripts/check-website-deploy.py
      - name: Explain missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice title=Not published::Cloudflare Pages credentials are absent, so the site was validated but not deployed."
      - name: Set up Node
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4.167.0 pages deploy website \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-dirty=true
      - name: Confirm the legal pages are exposed
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for attempt in 1 2 3 4 5; do
            missing=0
            for page in / /legal/ /legal/privacy.html /legal/data-use.html /legal/terms.html /legal/license.html; do
              code=$(curl -sS -o /tmp/page.html -w '%{http_code}' "$SITE_URL$page" || echo 000)
              if [ "$code" != "200" ]; then
                echo "::warning::$page returned $code"
                missing=1
              fi
            done
            [ "$missing" = "0" ] && break
            sleep 10
          done
          if [ "$missing" != "0" ]; then
            echo "::error::The published site is missing a page. Check that legal/ was uploaded and the project's production branch is main."
            exit 1
          fi
          curl -sS "$SITE_URL/legal/privacy.html" | grep -q 'Privacy Policy' \
            || { echo "::error::The privacy policy URL does not serve the policy text."; exit 1; }
