name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Install verified Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install pinned Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test implemented behavior
        shell: bash
        run: |
          if find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --no-pub
          else
            echo 'No application behavior tests yet (milestone 1 scaffold).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate Android build
        run: flutter build apk --debug --no-pub
      - name: Native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Publishing status
        run: echo 'Publishing not configured. Validation only; no signing, upload or store submission.' >> "$GITHUB_STEP_SUMMARY"
