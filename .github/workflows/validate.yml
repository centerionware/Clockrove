name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_dependencies:
        description: Resolve a proposed dependency lockfile as a source artifact
        type: boolean
        default: false

      strict_localization:
        description: Fail if the audit still finds untranslated copy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test bounded APK install recovery policies
        id: adb_policy_tests
        continue-on-error: true
        shell: bash
        run: bash scripts/test-ci-adb-install.sh
      - name: Set up Java
        id: java_setup
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.17+10'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
            .github/workflows/validate.yml
            .github/gradle/flutter-plugin-repositories.init.gradle
      - name: Install verified Flutter SDK
        id: flutter_setup
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"
      - name: Configure Kotlin resolution for Flutter Gradle plugins
        id: gradle_repositories
        shell: bash
        run: |
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cp .github/gradle/flutter-plugin-repositories.init.gradle "$init_dir/"
      - name: Install pinned Android components
        id: android_sdk
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/clockrove-android-sdk"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/19.0"
          sdkmanager="$sdk_root/cmdline-tools/19.0/bin/sdkmanager"
          # yes may receive SIGPIPE after sdkmanager finishes reading licenses.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          license_result=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_result" -eq 0
          "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Resolve locked dependencies
        id: dependencies
        env:
          PREPARE: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_dependencies && github.actor == 'centerionware' }}
        run: |
          if [[ "$PREPARE" == true ]]; then
            flutter pub get
          else
            flutter pub get --enforce-lockfile
          fi
      - name: Export proposed source lockfile
        id: proposed_lockfile_export
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_dependencies && github.actor == 'centerionware'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proposed-pubspec-lock
          path: pubspec.lock
          retention-days: 1
          if-no-files-found: error
      - name: Check generated localization sources against catalogs
        id: localization_sources
        continue-on-error: true
        run: |
          python3 tool/flutter_catalog.py --check
          python3 tool/android_catalog.py --check
      - name: Audit app localization coverage
        id: localization_audit
        continue-on-error: true
        env:
          STRICT_LOCALIZATION: ${{ inputs.strict_localization }}
        run: |
          flags=()
          if [[ "$STRICT_LOCALIZATION" == true ]]; then
            flags+=(--strict)
          fi
          dart run tool/localization_audit.dart "${flags[@]}" > "$RUNNER_TEMP/localization-audit.txt"
      - name: Export localization findings
        id: localization_audit_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localization-audit
          path: ${{ runner.temp }}/localization-audit.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Check formatting
        id: format
        # Collect behavior evidence in the same run; the final gate still fails.
        continue-on-error: true
        run: |
          dart format lib test integration_test tool
          git diff --binary -- lib test integration_test tool > "$RUNNER_TEMP/format.patch"
          git diff --exit-code -- lib test integration_test tool
      - name: Export formatter correction for source review
        id: formatter_patch_artifact
        if: always() && steps.format.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatter-source-patch
          path: ${{ runner.temp }}/format.patch
          retention-days: 1
          if-no-files-found: ignore
      - name: Annotate formatter correction for source review
        id: formatter_annotation
        if: always() && steps.format.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/format.patch" <<'PY_FORMAT'
          import pathlib
          import sys
          patch = pathlib.Path(sys.argv[1]).read_text(errors='replace')[:6000]
          escaped = patch.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Dart formatter correction::{escaped or "Formatter patch was empty"}')
          PY_FORMAT
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-pub
      - name: Test implemented behavior
        id: dart_tests
        continue-on-error: true
        shell: bash
        run: |
          if find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --no-pub
          else
            echo 'No application behavior tests yet (milestone 1 scaffold).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export synthetic UI previews
        id: ui_preview_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-previews
          path: build/ui-preview/*.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Validate Android build
        id: android_build
        continue-on-error: true
        run: flutter build apk --debug --no-pub
      - name: Configure release plugin registration without artifacts
        id: release_config
        continue-on-error: true
        run: flutter build apk --release --config-only
      - name: Compile release Java without signing
        id: release_java
        continue-on-error: true
        run: ./gradlew :app:compileReleaseJavaWithJavac
        working-directory: android
      - name: Assemble Android instrumentation tests before emulator setup
        id: instrumentation_build
        continue-on-error: true
        working-directory: android
        run: ./gradlew :app:assembleDebugAndroidTest
      - name: Native unit tests
        id: native_tests
        continue-on-error: true
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Export native test results
        id: native_results_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-results
          path: build/app/test-results/testDebugUnitTest/*.xml
          retention-days: 1
          if-no-files-found: ignore
      - name: Real Android PDF generation and rendering on API 24 and 35
        id: android_suites
        continue-on-error: true
        run: bash scripts/ci-android-pdf.sh
      - name: Check invoice viewer using actual Android-generated pages
        id: document_preview
        continue-on-error: true
        run: flutter test --no-pub test/invoice_document_preview_test.dart test/quote_document_preview_test.dart --dart-define=CLOCKROVE_DEVICE_PREVIEW=true
      - name: Export actual-document Flutter previews
        id: invoice_preview_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: invoice-viewer-previews
          path: build/invoice-viewer-preview
          retention-days: 1
          if-no-files-found: ignore
      - name: Export Android device test results
        id: device_results_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-device-test-results
          path: build/device-test-results
          retention-days: 1
          if-no-files-found: ignore
      - name: Export synthetic Android visual previews
        id: native_ui_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ui-previews
          path: build/native-ui-preview
          retention-days: 1
          if-no-files-found: ignore
      - name: Set up Ruby for release checks
        id: ruby_setup
        continue-on-error: true
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4 # v1.207.0
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.23'
      - name: Validate locked release tooling and version policy
        id: release_tools
        if: always() && steps.ruby_setup.outcome == 'success'
        continue-on-error: true
        env:
          BUNDLE_FROZEN: 'true'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec ruby test/release_version_test.rb
          bundle exec ruby -c fastlane/Fastfile
      - name: Publishing status
        run: echo 'Validation only. Successful main pushes trigger separate Play internal delivery; production tags remain readiness-gated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize validation failures
        if: always()
        env:
          CHECK_RESULTS: |
            Source checkout|${{ steps.checkout.outcome }}
            Java setup|${{ steps.java_setup.outcome }}
            Flutter SDK setup|${{ steps.flutter_setup.outcome }}
            Gradle plugin repository setup|${{ steps.gradle_repositories.outcome }}
            Android SDK setup|${{ steps.android_sdk.outcome }}
            Locked dependencies|${{ steps.dependencies.outcome }}
            APK install recovery policy tests|${{ steps.adb_policy_tests.outcome }}
            Proposed lockfile artifact|${{ steps.proposed_lockfile_export.outcome }}
            Generated localization parity|${{ steps.localization_sources.outcome }}
            Localization coverage audit|${{ steps.localization_audit.outcome }}
            Localization audit artifact|${{ steps.localization_audit_artifact.outcome }}
            Dart formatting|${{ steps.format.outcome }}
            Formatter patch artifact|${{ steps.formatter_patch_artifact.outcome }}
            Formatter annotation|${{ steps.formatter_annotation.outcome }}
            Dart analysis|${{ steps.analyze.outcome }}
            Dart behavior tests|${{ steps.dart_tests.outcome }}
            UI preview artifact|${{ steps.ui_preview_artifact.outcome }}
            Android debug build|${{ steps.android_build.outcome }}
            Android release configuration|${{ steps.release_config.outcome }}
            Android release Java compile|${{ steps.release_java.outcome }}
            Android instrumentation APK|${{ steps.instrumentation_build.outcome }}
            Native unit tests|${{ steps.native_tests.outcome }}
            Native test results artifact|${{ steps.native_results_artifact.outcome }}
            API 24 and API 35 journeys|${{ steps.android_suites.outcome }}
            Invoice and quote document preview|${{ steps.document_preview.outcome }}
            Invoice preview artifact|${{ steps.invoice_preview_artifact.outcome }}
            Android device results artifact|${{ steps.device_results_artifact.outcome }}
            Native UI artifact|${{ steps.native_ui_artifact.outcome }}
            Ruby setup|${{ steps.ruby_setup.outcome }}
            Release tooling and version policy|${{ steps.release_tools.outcome }}
        shell: bash
        run: |
          failures=()
          while IFS='|' read -r label outcome; do
            if [[ "$outcome" == failure ]]; then
              failures+=("$label")
            fi
          done <<< "$CHECK_RESULTS"
          {
            echo '## Validation results'
            if ((${#failures[@]})); then
              echo 'Failed checks:'
              printf -- '- %s\n' "${failures[@]}"
              echo 'See the corresponding step logs and Android journey failure list for details.'
            else
              echo 'All validation checks passed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if ((${#failures[@]})); then
            printf 'Validation checks failed: %s\n' "${failures[*]}" >&2
            exit 1
          fi
