name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_dependencies:
        description: Resolve a proposed dependency lockfile as a source artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - name: Install verified Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz -o "$RUNNER_TEMP/flutter.tar.xz"
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"
      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/clockrove-android-sdk"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/19.0"
          sdkmanager="$sdk_root/cmdline-tools/19.0/bin/sdkmanager"
          # yes may receive SIGPIPE after sdkmanager finishes reading licenses.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          license_result=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_result" -eq 0
          "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - name: Resolve locked dependencies
        env:
          PREPARE: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_dependencies && github.actor == 'centerionware' }}
        run: |
          if [[ "$PREPARE" == true ]]; then
            flutter pub get
          else
            flutter pub get --enforce-lockfile
          fi
      - name: Export proposed source lockfile
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_dependencies && github.actor == 'centerionware'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proposed-pubspec-lock
          path: pubspec.lock
          retention-days: 1
          if-no-files-found: error
      - name: Check formatting
        id: format
        # Collect behavior evidence in the same run; the final gate still fails.
        continue-on-error: true
        run: |
          dart format lib test
          git diff --binary -- lib test > "$RUNNER_TEMP/format.patch"
          git diff --exit-code -- lib test
      - name: Export formatter correction for source review
        if: always() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatter-source-patch
          path: ${{ runner.temp }}/format.patch
          retention-days: 1
          if-no-files-found: ignore
      - name: Annotate formatter correction for source review
        if: always() && steps.format.outcome == 'failure'
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/format.patch" <<'PY_FORMAT'
          import pathlib
          import sys
          patch = pathlib.Path(sys.argv[1]).read_text(errors='replace')[:6000]
          escaped = patch.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Dart formatter correction::{escaped or "Formatter patch was empty"}')
          PY_FORMAT
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test implemented behavior
        shell: bash
        run: |
          if find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --no-pub
          else
            echo 'No application behavior tests yet (milestone 1 scaffold).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export synthetic UI previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-previews
          path: build/ui-preview/*.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Validate Android build
        run: flutter build apk --debug --no-pub
      - name: Native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Export native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-results
          path: build/app/test-results/testDebugUnitTest/*.xml
          retention-days: 1
          if-no-files-found: ignore
      - name: Real Android PDF generation and rendering on API 24 and 35
        run: bash scripts/ci-android-pdf.sh
      - name: Check invoice viewer using actual Android-generated pages
        run: flutter test --no-pub test/invoice_document_preview_test.dart test/quote_document_preview_test.dart --dart-define=CLOCKROVE_DEVICE_PREVIEW=true
      - name: Export actual-document Flutter previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: invoice-viewer-previews
          path: build/invoice-viewer-preview
          retention-days: 1
          if-no-files-found: ignore
      - name: Export Android device test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-device-test-results
          path: build/device-test-results
          retention-days: 1
          if-no-files-found: ignore
      - name: Export synthetic Android visual previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ui-previews
          path: build/native-ui-preview
          retention-days: 1
          if-no-files-found: ignore
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4 # v1.207.0
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.23'
      - name: Validate locked release tooling and version policy
        env:
          BUNDLE_FROZEN: 'true'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec ruby test/release_version_test.rb
          bundle exec ruby -c fastlane/Fastfile
      - name: Publishing status
        run: echo 'Validation only. Successful main pushes trigger separate Play internal delivery; production tags remain readiness-gated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require clean formatting
        if: always() && steps.format.outcome == 'failure'
        run: |
          echo 'Apply the exported formatter-source-patch and revalidate.' >&2
          exit 1
