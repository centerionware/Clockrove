helpLocationHistory: "管理保存的位置历史"
helpTimekeepingBody: "创建工作项目，然后在工作页面启动计时器。结束时停止计时器。可在工作历史中补录遗漏的记录或更正时间。手动计时无需位置权限。"
helpBackupsBody: "在设置中选择导出加密备份，将文件保存到日后可以访问的位置，并单独保管密码。恢复前停止计时器，选择恢复加密备份并输入密码。应用前请审核建议的合并并解决冲突。"
helpLocationHistoryBody: "工作位置记录决定 Clockrove 是否在计时期间保存位置。工作地点自动化有独立设置。使用删除位置历史功能可从应用中删除保存的 GPS 点。之前导出的副本仍留在原来的保存位置。"
helpBoardsBody: "打开工作项目即可查看看板。将任务添加到列，随后按进度移动。可以复用任务库中的任务来创建新卡片。归档已完成的工作项目，可将其从活动列表移除并保留历史。"
helpReportsBody: "从主菜单选择报表可查看多个工作项目，也可从看板打开单个项目的报表。查看合计之前，请选择日期范围和工作项目。将选中的报表以 CSV 格式导出到指定位置。分享之前请核对日期范围。"
helpBillingBody: "从主菜单打开报价单以创建和检查报价。报价被接受后，核对应归入项目的工作内容。创建发票前，请核对客户、价格和涵盖的工作。打开“发票”可查看保存的 PDF 并记录付款。"
helpAutomationBody: "打开工作项目的设置，添加工作地点并启用自动化。允许访问精确位置；如果 Android 要求，还需允许后台位置访问。如果没有检测到到达，请确认地点已启用，并在相应选项出现时刷新或重试地点监控。监控就绪后，离开该地点再返回以触发新的到达。排查问题时仍可手动开始或结束计时。"
helpWidgetsBody: "打开 Android 启动器的小组件选择器，添加 Clockrove 小组件。选择默认工作项目，或在开始计时时再选。工作期间，计时小组件显示当前的工作项目，也可以停止计时。任务和组合小组件按各自设置显示即将到来的工作。"
