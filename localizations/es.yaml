helpLocationHistory: "Gestionar el historial de ubicación guardado"
helpTimekeepingBody: "Crea un trabajo e inicia su temporizador desde la pantalla de trabajo. Detén el temporizador al terminar. Usa el historial del trabajo para añadir una entrada olvidada o corregir la hora. El temporizador manual funciona sin acceso a la ubicación."
helpBackupsBody: "En Ajustes, elige Exportar copia de seguridad cifrada y guarda el archivo donde puedas encontrarlo después. Guarda la contraseña por separado. Para restaurar, detén el temporizador, elige Restaurar copia de seguridad cifrada e introduce la contraseña. Revisa la combinación propuesta y resuelve los conflictos antes de aplicarla."
helpLocationHistoryBody: "El registro de ubicación de trabajo controla si Clockrove guarda ubicaciones durante una sesión. La automatización tiene su propio ajuste. Usa la opción de eliminar el historial para quitar puntos GPS de la app. Las copias ya exportadas permanecen en su destino."
helpBoardsBody: "Abre un trabajo para ver su tablero. Añade una tarea a una columna y muévela a medida que avance. Reutiliza una tarea de la biblioteca para crear una tarjeta. Archiva los trabajos terminados para quitarlos de las listas activas y conservar el historial."
helpReportsBody: "Elige Informes en el menú principal para consultar varios trabajos o abre el informe del trabajo desde su tablero. Selecciona las fechas y los trabajos antes de revisar los totales. Exporta el informe a CSV en la ubicación que elijas. Revisa las fechas antes de compartirlo."
helpBillingBody: "Abre Presupuestos en el menú principal para preparar y revisar un presupuesto. Cuando se acepte, revisa qué trabajos incluye. Comprueba el cliente, los precios y los trabajos incluidos antes de preparar la factura. Abre Facturas para ver el PDF guardado y registrar pagos."
helpAutomationBody: "Abre los ajustes de un trabajo para añadir un lugar de trabajo y habilitar la automatización. Permite la ubicación precisa y, si Android lo requiere, el acceso en segundo plano. Si no se detecta una llegada, comprueba que el lugar esté habilitado y usa la opción de actualizar o reintentar la supervisión si aparece. Cuando esté lista, sal del lugar y vuelve a entrar. Puedes fichar manualmente mientras solucionas el problema."
helpWidgetsBody: "Abre el selector de widgets del lanzador de Android y añade un widget de Clockrove. Selecciona un trabajo predeterminado o elígelo al fichar. Durante el trabajo, el widget del temporizador muestra el trabajo activo y permite detenerlo. Los widgets de tareas y combinados muestran trabajo próximo según su configuración."
