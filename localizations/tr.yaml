helpLocationHistory: "Kaydedilen konum geçmişini yönetme"
helpTimekeepingBody: "Bir iş oluşturun ve çalışma ekranından zamanlayıcısını başlatın. İş bitince zamanlayıcıyı durdurun. Eksik bir kayıt eklemek veya saati düzeltmek için iş geçmişini kullanın. Elle zamanlayıcı konum erişimi olmadan çalışır."
helpBackupsBody: "Ayarlar’da Şifreli yedeği dışa aktar seçeneğini seçip dosyayı daha sonra erişebileceğiniz bir yere kaydedin. Parolayı ayrı saklayın. Geri yüklemek için zamanlayıcıyı durdurun, Şifreli yedeği geri yükle seçeneğini seçin ve parolayı girin. Uygulamadan önce birleştirmeyi inceleyip çakışmaları giderin."
helpLocationHistoryBody: "Çalışma konumu kaydı, Clockrove’un oturum sırasında konumları kaydedip kaydetmeyeceğini belirler. İş yeri otomasyonu ayrı ayarlanır. Uygulamadaki GPS noktalarını kaldırmak için konum geçmişini silme denetimini kullanın. Daha önce dışa aktarılan kopyalar kaydedildikleri yerde kalır."
helpBoardsBody: "Panosunu görmek için bir işi açın. Bir sütuna görev ekleyin ve iş ilerledikçe taşıyın. Yeni bir kart oluşturmak için kitaplıktaki bir görevi yeniden kullanın. Geçmişini koruyarak biten işi etkin listelerden kaldırmak için arşivleyin."
helpReportsBody: "Birden fazla iş için ana menüden Raporlar’ı seçin veya panodan iş raporunu açın. Toplamları incelemeden önce tarih aralığını ve işleri seçin. Seçilen raporu istediğiniz yere CSV olarak aktarın. Paylaşmadan önce tarih aralığını kontrol edin."
helpBillingBody: "Teklif hazırlayıp incelemek için ana menüden Teklifler’i açın. Kabul edildikten sonra hangi çalışmaların işe dahil olduğunu inceleyin. Faturayı hazırlamadan önce müşteriyi, fiyatları ve dahil edilen çalışmaları kontrol edin. Kayıtlı PDF’yi görmek ve ödemeleri kaydetmek için Faturalar’ı açın."
helpAutomationBody: "İş ayarlarından bir iş yeri ekleyin ve otomasyonu açın. Kesin konuma ve Android gerektiriyorsa arka plan konumuna izin verin. Varış algılanmazsa iş yerinin etkin olduğunu kontrol edin ve gösteriliyorsa izlemeyi yenileme veya yeniden deneme seçeneğini kullanın. İzleme hazır olduğunda alandan ayrılıp geri dönün. Sorunu giderirken süre kaydını elle başlatıp bitirebilirsiniz."
helpWidgetsBody: "Android başlatıcısında widget seçiciyi açıp bir Clockrove widget’ı ekleyin. Varsayılan bir iş seçin veya süre kaydını başlatırken işi seçin. Çalışırken zamanlayıcı widget’ı etkin işi gösterir ve durdurabilir. Görev ve birleşik widget’lar ayarlarına göre yaklaşan işleri gösterir."
