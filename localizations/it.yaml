helpLocationHistory: "Gestisci la cronologia delle posizioni salvata"
helpTimekeepingBody: "Crea un lavoro e avvia il timer dalla schermata di lavoro. Fermalo quando hai finito. Usa la cronologia del lavoro per aggiungere una registrazione dimenticata o correggere l’orario. Il timer manuale funziona senza accesso alla posizione."
helpBackupsBody: "In Impostazioni, scegli Esporta backup crittografato e salva il file in un luogo accessibile in seguito. Conserva la password separatamente. Per ripristinare, ferma il timer, scegli Ripristina backup crittografato e inserisci la password. Esamina l’unione proposta e risolvi i conflitti prima di applicarla."
helpLocationHistoryBody: "La registrazione della posizione di lavoro determina se Clockrove salva le posizioni durante una sessione. L’automazione ha un’impostazione propria. Usa il comando di eliminazione della cronologia per rimuovere i punti GPS salvati dall’app. Le copie già esportate restano nella destinazione scelta."
helpBoardsBody: "Apri un lavoro per vedere la sua bacheca. Aggiungi un’attività a una colonna e spostala man mano che procede. Riutilizza un’attività della libreria per iniziare una nuova scheda. Archivia un lavoro finito per rimuoverlo dagli elenchi attivi conservandone la cronologia."
helpReportsBody: "Scegli Report dal menu principale per consultare più lavori oppure apri il report del lavoro dalla bacheca. Scegli l’intervallo di date e i lavori prima di verificare i totali. Esporta il report in CSV nella destinazione scelta. Controlla le date prima di condividerlo."
helpBillingBody: "Apri Preventivi dal menu principale per preparare e verificare un preventivo. Dopo l’accettazione, verifica quali lavori includere. Controlla il cliente, i prezzi e le prestazioni incluse prima di preparare la fattura. Apri Fatture per consultare il PDF salvato e registrare i pagamenti."
helpAutomationBody: "Apri le impostazioni di un lavoro per aggiungere un luogo e attivare l’automazione. Consenti la posizione precisa e, se Android lo richiede, quella in background. Se un arrivo non viene rilevato, verifica che il luogo sia attivo e usa l’opzione per aggiornare o riprovare il monitoraggio se disponibile. Quando il monitoraggio è pronto, lascia il luogo e torna. Durante la risoluzione dei problemi puoi timbrare manualmente."
helpWidgetsBody: "Apri il selettore dei widget del launcher Android e aggiungi un widget Clockrove. Scegli un lavoro predefinito o selezionalo quando timbri l’entrata. Durante il lavoro, il widget timer mostra il lavoro attivo e può fermarlo. I widget attività e combinati mostrano i lavori in arrivo secondo la configurazione."
