helpLocationHistory: "管理儲存的位置歷史"
helpTimekeepingBody: "建立工作項目，然後在工作畫面啟動計時器。結束時停止計時器。可在工作歷史中補登遺漏的紀錄或更正時間。手動計時無須位置權限。"
helpBackupsBody: "在設定中選擇匯出加密備份，將檔案儲存到日後可以存取的位置，並另外保管密碼。還原前停止計時器，選擇還原備份；僅當備份已加密時才輸入密碼。套用前請審查建議的合併並解決衝突。"
helpLocationHistoryBody: "工作位置記錄決定 Clockrove 是否在計時期間儲存位置。工作地點自動化有獨立設定。使用刪除位置歷史功能可從應用程式移除已儲存的 GPS 點。先前匯出的副本仍留在原本的儲存位置。"
helpBoardsBody: "開啟工作項目即可檢視看板。將任務新增至欄，再依進度移動。可重複使用任務庫中的任務來建立新卡片。將已完成的工作項目封存，可從使用中的清單移除並保留歷史紀錄。"
helpReportsBody: "從主選單選擇報表可檢視多個工作項目，也可從看板開啟單一項目的報表。檢視總計前，請選擇日期範圍和工作項目。將選定的報表匯出為 CSV 並儲存至指定位置。分享前請核對日期範圍。"
helpBillingBody: "從主選單開啟報價單以建立和檢查報價。報價被接受後，核對應納入項目的工作內容。建立發票前，請核對客戶、價格和涵蓋的工作。開啟「發票」可檢視已儲存的 PDF 並記錄付款。"
helpAutomationBody: "開啟工作項目的設定，新增工作地點並啟用自動化。允許存取精確位置；如果 Android 要求，也需允許背景位置存取。如果沒有偵測到抵達，請確認地點已啟用，並在出現相應選項時重新整理或重試地點監控。監控就緒後，離開該地點再返回以觸發新的抵達。排查問題時仍可手動開始或結束計時。 如果已啟用抵達時開始工作，並在目前位置儲存工作地點，Clockrove 會詢問是否立即開始工作。在地點內儲存修改後的地點會重設抵達偵測；確認離開並再次進入後才會恢復。Android 建議使用 100–150 公尺半徑；更小的半徑可能漏掉抵達事件。"
helpWidgetsBody: "開啟 Android 啟動器的小工具選擇器，新增 Clockrove 小工具。選擇預設工作項目，或在開始計時時再選。工作期間，計時小工具會顯示目前的工作項目，也可停止計時。任務和組合小工具會依各自設定顯示即將到來的工作。"
