行，還原交易也會被拒絕。"\nrestorePreviewAlreadyStale: "無法再次套用此預覽。請捨棄預覽，再選擇備份以建立目前資料的新預覽。"\nrestoreDeletionCountNote: "此數量僅計算備份中的刪除標記，並非受影響的所有記錄。"\nrestoreCancelled: "已取消預覽。未變更任何本機記錄。"\nrestoreCleanupFailed: "無法清理還原暫存資料。請關閉並重新開啟 Clockrove 後再試一次。"\nrestoreFailed: "無法處理備份。請檢查所選檔案後再試一次。"\nrestoreUnlockFailed: "無法解鎖備份。請檢查密碼和檔案。"\nrestoreAllConflictsReviewed: "已審查所有衝突頁面。套用時會檢查本機版本，並在一個交易中儲存所有選擇。"\nhelp: "說明"\nhelpSearch: "搜尋說明"\nhelpNoResults: "沒有相符的說明主題。"\nhelpVersion: "Clockrove 版本 {version}"\nhelpWith: "{topic}的說明"\nhelpTimekeeping: "開始並檢視工作"\nhelpAutomation: "位置與工作地點自動化"\nhelpBackups: "備份和還原記錄"\nhelpBoards: "整理工作項目與任務"\nhelpReports: "執行報表並匯出 CSV"\nhelpBilling: "準備報價單和發票"\nhelpWidgets: "使用 Android 主畫面小工具"\nhelpLocationHistory: "管理儲存的位置歷史"\nhelpTimekeepingBody: "建立工作項目，然後在工作畫面啟動計時器。結束時停止計時器。可在工作歷史中補登遺漏的紀錄或更正時間。手動計時無須位置權限。"\nhelpBackupsBody: "在設定中選擇匯出加密備份，將檔案儲存到日後可以存取的位置，並另外保管密碼。還原前停止計時器，選擇還原加密備份並輸入密碼。套用前請審查建議的合併並解決衝突。"\nhelpLocationHistoryBody: "工作位置記錄決定 Clockrove 是否在計時期間儲存位置。工作地點自動化有獨立設定。使用刪除位置歷史功能可從應用程式移除已儲存的 GPS 點。先前匯出的副本仍留在原本的儲存位置。"\nhelpBoardsBody: "開啟工作項目即可檢視看板。將任務新增至欄，再依進度移動。可重複使用任務庫中的任務來建立新卡片。將已完成的工作項目封存，可從使用中的清單移除並保留歷史紀錄。"\nhelpReportsBody: "從主選單選擇報表可檢視多個工作項目，也可從看板開啟單一項目的報表。檢視總計前，請選擇日期範圍和工作項目。將選定的報表匯出為 CSV 並儲存至指定位置。分享前請核對日期範圍。"\nhelpBillingBody: "從主選單開啟報價單以建立和檢查報價。報價被接受後，核對應納入項目的工作內容。建立發票前，請核對客戶、價格和涵蓋的工作。開啟「發票」可檢視已儲存的 PDF 並記錄付款。"\nhelpAutomationBody: "開啟工作項目的設定，新增工作地點並啟用自動化。允許存取精確位置；如果 Android 要求，也需允許背景位置存取。如果沒有偵測到抵達，請確認地點已啟用，並在出現相應選項時重新整理或重試地點監控。監控就緒後，離開該地點再返回以觸發新的抵達。排查問題時仍可手動開始或結束計時。"\nhelpWidgetsBody: "開啟 Android 啟動器的小工具選擇器，新增 Clockrove 小工具。選擇預設工作項目，或在開始計時時再選。工作期間，計時小工具會顯示目前的工作項目，也可停止計時。任務和組合小工具會依各自設定顯示即將到來的工作。"\nwidgetSettings: "小工具設定"\nwidgetRetrySettings: "重新載入小工具設定"\nretryJobs: "重新載入工作項目"\nwidgetRefreshJobsFailed: "無法重新整理工作項目。已保留你的選擇及正在執行的操作。"\nwidgetChooseTaskJobs: "選擇要在任務清單中顯示的工作項目。"\nwidgetChooseDefaultJob: "選擇預設工作項目以一鍵開始計時，或每次個別選擇。"\nwidgetTaskWindow: "顯示已逾期及未來 7 個日曆日的任務。已完成的任務和已封存的工作項目不會顯示。"\nwidgetTimerBehavior: "計時器一律顯示目前正在進行的工作項目。開始另一項工作前，請先結束計時。點選工作項目名稱可變更