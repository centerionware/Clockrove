helpTimekeepingBody: "أنشئ عملاً ثم شغّل مؤقته من شاشة العمل. أوقف المؤقت عند الانتهاء. استخدم سجل العمل لإضافة إدخال فاتك أو لتصحيح الوقت. يعمل المؤقت اليدوي دون إذن الموقع."
helpBackupsBody: "في الإعدادات، اختر تصدير نسخة احتياطية مشفّرة واحفظها في مكان يمكنك الوصول إليه لاحقًا. احفظ كلمة المرور منفصلة. للاستعادة، أوقف المؤقت واختر استعادة نسخة احتياطية مشفّرة وأدخل كلمة المرور. راجع الدمج المقترح وحل التعارضات قبل التطبيق."
helpLocationHistoryBody: "يحدد تسجيل موقع العمل ما إذا كان Clockrove يحفظ المواقع أثناء الجلسة. لأتمتة الموقع إعداد مستقل. استخدم خيار حذف سجل المواقع لإزالة نقاط GPS المحفوظة من التطبيق. تبقى النسخ التي صدّرتها في وجهتها."
helpBoardsBody: "افتح عملاً لعرض لوحته. أضف مهمة إلى عمود وانقلها مع تقدّم العمل. أعد استخدام مهمة من المكتبة لإنشاء بطاقة جديدة. أرشف العمل المنتهي لإزالته من القوائم النشطة مع الاحتفاظ بسجله."
helpReportsBody: "اختر التقارير من القائمة الرئيسية لعرض العمل عبر عدة أعمال، أو افتح تقرير العمل من لوحته. حدد المدة والأعمال قبل مراجعة الإجماليات. صدّر التقرير بصيغة CSV إلى وجهتك المختارة. راجع المدة قبل مشاركته."
helpBillingBody: "افتح عروض الأسعار من القائمة لإعداد عرض ومراجعته. بعد قبوله، راجع العمل الذي سيُدرج في المهمة. تحقق من العميل والأسعار والعمل المشمول قبل إعداد الفاتورة. افتح الفواتير لعرض ملف PDF المحفوظ وتسجيل المدفوعات."
helpAutomationBody: "افتح إعدادات العمل لإضافة موقع عمل وتفعيل الأتمتة. اسمح بالموقع الدقيق، وكذلك بالموقع في الخلفية إذا طلب Android ذلك. إذا لم يُرصد الوصول، فتحقق من تفعيل الموقع واستخدم خيار تحديث مراقبة الموقع أو إعادة المحاولة إن ظهر. عندما تصبح المراقبة جاهزة، غادر الموقع وعد إليه لرصد وصول جديد. يمكنك بدء تسجيل العمل أو إنهاؤه يدويًا أثناء معالجة المشكلة."
helpWidgetsBody: "افتح منتقي الأدوات في مشغّل Android وأضف أداة Clockrove. اختر عملاً افتراضيًا أو اختر العمل عند بدء التسجيل. أثناء العمل، تعرض أداة المؤقت العمل الجاري ويمكنها إيقافه. تعرض أدوات المهام والأدوات المدمجة الأعمال القادمة وفق إعداداتها."
