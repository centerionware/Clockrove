سعار من القائمة لإعداد عرض ومراجعته. بعد قبوله، راجع العمل الذي سيُدرج في المهمة. تحقق من العميل والأسعار والعمل المشمول قبل إعداد الفاتورة. افتح الفواتير لعرض ملف PDF المحفوظ وتسجيل المدفوعات."\nhelpAutomationBody: "افتح إعدادات العمل لإضافة موقع عمل وتفعيل الأتمتة. اسمح بالموقع الدقيق، وكذلك بالموقع في الخلفية إذا طلب Android ذلك. إذا لم يُرصد الوصول، فتحقق من تفعيل الموقع واستخدم خيار تحديث مراقبة الموقع أو إعادة المحاولة إن ظهر. عندما تصبح المراقبة جاهزة، غادر الموقع وعد إليه لرصد وصول جديد. يمكنك بدء تسجيل العمل أو إنهاؤه يدويًا أثناء معالجة المشكلة."\nhelpWidgetsBody: "افتح منتقي الأدوات في مشغّل Android وأضف أداة Clockrove. اختر عملاً افتراضيًا أو اختر العمل عند بدء التسجيل. أثناء العمل، تعرض أداة المؤقت العمل الجاري ويمكنها إيقافه. تعرض أدوات المهام والأدوات المدمجة الأعمال القادمة وفق إعداداتها."\nwidgetSettings: "إعدادات الأداة"\nwidgetRetrySettings: "أعد محاولة تحميل إعدادات الأداة"\nretryJobs: "أعد محاولة تحميل الأعمال"\nwidgetRefreshJobsFailed: "تعذر تحديث الأعمال. تم الاحتفاظ باختيارك والعملية الجارية."\nwidgetChooseTaskJobs: "اختر الأعمال التي تظهر في قائمة المهام."\nwidgetChooseDefaultJob: "اختر عملاً افتراضيًا لبدء التسجيل بلمسة واحدة، أو اختر عملاً في كل مرة."\nwidgetTaskWindow: "المهام المتأخرة والمستحقة في الأيام السبعة المقبلة. تُخفى المهام المكتملة والأعمال المؤرشفة."\nwidgetTimerBehavior: "يعرض المؤقت دائمًا العمل الجاري. أنهِ تسجيل الوقت قبل بدء عمل آخر. اضغط على اسم العمل لتغيير الإعدادات."\nwidgetSelectedJobUnavailable: "العمل المحدد غير متاح. اختر عملاً نشطًا أو اختر عند كل بدء."\nwidgetAllJobs: "جميع الأعمال النشطة"\nwidgetChooseEachTime: "الاختيار في كل مرة"\ndone: "تم"\nwidgetSave: "حفظ الأداة"\nwidgetFinishRetry: "حُفظت الإعدادات. اضغط على تم لإغلاق إعداد الأداة."\ncommandResultUnknown: "النتيجة غير معروفة. أعد محاولة العملية نفسها للتحقق قبل المغادرة."\ncommandRetry: "أعد محاولة العملية نفسها"\ncommandChangeFailed: "تعذر تطبيق التغيير. تم الاحتفاظ بالمسودة. حدّث التفاصيل وحاول مجددًا."\ncommandStaleState: "تغيرت البيانات. تم الاحتفاظ 