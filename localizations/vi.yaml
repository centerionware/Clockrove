helpLocationHistory: "Quản lý lịch sử vị trí đã lưu"
helpTimekeepingBody: "Tạo một công việc rồi bắt đầu bộ đếm giờ trên màn hình làm việc. Dừng bộ đếm khi hoàn tất. Dùng lịch sử công việc để thêm mục bị bỏ sót hoặc sửa thời gian. Bộ đếm giờ thủ công hoạt động khi chưa cấp quyền vị trí."
helpBackupsBody: "Trong Cài đặt, chọn Xuất bản sao lưu đã mã hóa và lưu tệp ở nơi có thể truy cập sau này. Giữ mật khẩu ở chỗ riêng. Để khôi phục, dừng bộ đếm giờ, chọn Khôi phục bản sao lưu đã mã hóa và nhập mật khẩu. Xem phần hợp nhất được đề xuất và xử lý xung đột trước khi áp dụng."
helpLocationHistoryBody: "Tùy chọn ghi vị trí làm việc xác định Clockrove có lưu vị trí trong phiên làm việc hay không. Tự động hóa theo nơi làm việc có cài đặt riêng. Dùng tùy chọn xóa lịch sử vị trí để xóa các điểm GPS trong ứng dụng. Các bản sao đã xuất vẫn ở nơi lưu."
helpBoardsBody: "Mở công việc để xem bảng. Thêm nhiệm vụ vào một cột, rồi di chuyển theo tiến độ. Dùng lại nhiệm vụ từ thư viện để tạo thẻ mới. Lưu trữ công việc đã xong để xóa khỏi danh sách đang hoạt động mà vẫn giữ lịch sử."
helpReportsBody: "Chọn Báo cáo trong menu chính để xem nhiều công việc hoặc mở báo cáo từ bảng công việc. Chọn khoảng ngày và công việc trước khi xem tổng. Xuất báo cáo thành CSV tới vị trí đã chọn. Kiểm tra khoảng ngày trước khi chia sẻ."
helpBillingBody: "Mở Báo giá trong menu chính để lập và kiểm tra báo giá. Sau khi báo giá được chấp nhận, xem những phần việc thuộc công việc. Kiểm tra khách hàng, giá và phần việc được tính trước khi lập hóa đơn. Mở Hóa đơn để xem PDF đã lưu và ghi nhận thanh toán."
helpAutomationBody: "Mở cài đặt công việc để thêm nơi làm việc và bật tự động hóa. Cho phép vị trí chính xác và, nếu Android yêu cầu, vị trí trong nền. Nếu không phát hiện lúc đến, hãy kiểm tra nơi làm việc đã bật và dùng tùy chọn làm mới hoặc thử lại giám sát nếu xuất hiện. Khi giám sát đã sẵn sàng, rời khỏi nơi đó rồi quay lại. Bạn vẫn có thể bắt đầu hoặc kết thúc ghi giờ thủ công trong lúc khắc phục."
helpWidgetsBody: "Mở trình chọn tiện ích trên màn hình chính Android và thêm tiện ích Clockrove. Chọn công việc mặc định hoặc chọn khi bắt đầu ghi giờ. Khi đang làm việc, tiện ích bộ đếm giờ hiển thị công việc hiện tại và có thể dừng ghi giờ. Tiện ích nhiệm vụ và tiện ích kết hợp hiển thị công việc sắp tới theo cài đặt."
