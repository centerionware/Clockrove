helpLocationHistory: "Gerir o histórico de localização guardado"
helpTimekeepingBody: "Crie um trabalho e inicie o temporizador no ecrã de trabalho. Pare-o quando terminar. Use o histórico do trabalho para adicionar um registo em falta ou corrigir a hora. O temporizador manual funciona sem acesso à localização."
helpBackupsBody: "Nas Definições, escolha Exportar cópia de segurança encriptada e guarde o ficheiro num local acessível mais tarde. Guarde a palavra-passe separadamente. Para restaurar, pare o temporizador, escolha Restaurar cópia de segurança encriptada e introduza a palavra-passe. Reveja a fusão proposta e resolva os conflitos antes de a aplicar."
helpLocationHistoryBody: "O registo da localização de trabalho determina se o Clockrove guarda localizações durante uma sessão. A automatização tem uma definição própria. Use a opção de eliminação do histórico para apagar os pontos GPS guardados na aplicação. As cópias já exportadas permanecem no destino."
helpBoardsBody: "Abra um trabalho para ver o quadro. Adicione uma tarefa a uma coluna e mova-a à medida que o trabalho avança. Reutilize uma tarefa da biblioteca para iniciar um novo cartão. Arquive um trabalho concluído para o retirar das listas ativas e manter o histórico."
helpReportsBody: "Escolha Relatórios no menu principal para consultar vários trabalhos ou abra o relatório de um trabalho no quadro. Escolha o intervalo de datas e os trabalhos antes de rever os totais. Exporte o relatório em CSV para o destino escolhido. Confirme as datas antes de o partilhar."
helpBillingBody: "Abra Orçamentos no menu principal para preparar e rever um orçamento. Após a aceitação, confirme que serviços fazem parte do trabalho. Verifique o cliente, preços e serviços incluídos antes de preparar uma fatura. Abra Faturas para consultar o PDF guardado e registar pagamentos."
helpAutomationBody: "Abra as definições de um trabalho para adicionar um local de trabalho e ativar a automatização. Autorize a localização precisa e, se o Android exigir, a localização em segundo plano. Se uma chegada não for detetada, confirme que o local está ativo e utilize a opção de atualizar ou repetir a monitorização se aparecer. Quando estiver pronta, saia do local e regresse. Pode registar a entrada ou saída manualmente enquanto resolve o problema."
helpWidgetsBody: "Abra o seletor de widgets do launcher Android e adicione um widget Clockrove. Escolha um trabalho predefinido ou selecione-o ao registar a entrada. Durante o trabalho, o widget do temporizador mostra o trabalho ativo e permite pará-lo. Os widgets de tarefas e combinados mostram trabalhos próximos, de acordo com a configuração."
