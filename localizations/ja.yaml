nrestoreOpenSessionsOmitted: "バックアップ内の未終了または仮のセッションは除外されます。終了時刻を推定したり、タイマーを開始したりすることはありません。"\nrestoreDeviceSettingsExcluded: "自動化は無効のままです。地図の認証情報や端末登録情報はインポートされません。"\nrestorePreview: "復元のプレビュー"\nrestoreRecordCount: "バックアップ内の記録"\nrestoreAdditions: "追加予定"\nrestoreChanges: "変更される既存の記録"\nrestoreDeletionMarkers: "削除マーカー"\nrestoreUnchanged: "変更されない記録"\nrestoreConflicts: "確認が必要な競合"\nrestoreReferenceConflicts: "バックアップ内の参照の競合"\nrestoreOverlapConflicts: "バックアップ内の時間帯の重複"\nrestoreMediaFiles: "メディアファイル"\nrestoreMediaData: "メディアデータ"\nrestoreMebibytes: "{size} MiB"\nrestoreOnDevice: "この端末上"\nrestoreInBackup: "バックアップ内"\nrestoreOpenSessionConflict: "バックアップ内の未終了セッション"\nrestoreOverlappingInterval: "重複する作業時間"\nrestoreDeletedGps: "削除されたGPS履歴"\nrestoreSkippedDependency: "除外された項目に依存する記録"\nrestoreTableConflict: "{table}の競合"\nyes: "はい"\nno: "いいえ"\nrestorePasswordShort: "バックアップのパスワードを入力してください（UTF-8で12バイト以上）。"\nrestorePasswordLong: "パスワードが対応する長さを超えています。"\nrestoreChooseAndProtect: "Clockroveのバックアップを選び、パスワードを入力してください。ファイルは非公開の暗号化された一時領域に読み込まれます。パスワードは保存されず、Clockroveで復元することはできません。"\nrestoreLocalTimerBlocking: "この端末でタイマーが動作中です。復元する前に停止し、このプレビューを破棄して新しいプレビューを作成してください。端末のタイマーが動作中の場合、復元処理も拒否されます。"\nrestorePreviewAlreadyStale: "このプレビューは再適用できません。破棄してバックアップを選び直し、現在のデータのプレビューを作成してください。"\nrestoreDeletionCountNote: "削除マーカーの件数はバックアップ内の削除記録の数で、影響を受ける全記録の数ではありません。"\nrestoreCancelled: "プレビューをキャンセルしました。端末上の記録は変更されていません。"\nrestoreCleanupFailed: "復元の一時データを削除できませんでした。再試行する前にClockroveを終了して開き直してください。"\nrestoreFailed: "バックアップを処理できませんでした。選択したファイルを確認して再試行してください。"\nrestoreUnlockFailed: "バックアップを解除できませんでした。パスワードとファイルを確認してください。"\nrestoreAllConflictsReviewed: "すべての競合ページを確認しました。適用時に端末上のバージョンを確認し、すべての選択を1つのトランザクションで保存します。"\nhelp: "ヘルプ"\nhelpSearch: "ヘルプを検索"\nhelpNoResults: "該当するヘルプ項目はありません。"\nhelpVersion: "Clockrove バージョン {version}"\nhelpWith: "ヘルプ：{topic}"\nhelpTimekeeping: "勤務を開始して確認する"\nhelpAutomation: "位置情報と勤務場所による自動化"\nhelpBackups: "記録をバックアップして復元する"\nhelpBoards: "仕事とタスクを整理する"\nhelpReports: "レポートを作成してCSVをエクスポートする"\nhelpBilling: "見積書と請求書を作成する"\nhelpWidgets: "Androidのホーム画面ウィジェットを使う"\nhelpLocationHistory: "保存した位置履歴を管理する"\nhelpTimekeepingBody: "仕事を作成し、作業画面からタイマーを開始してください。作業が終わったら停止します。記録を追加したい場合や時刻を修正したい場合は、仕事の履歴を開いてください。手動タイマーは位置情報にアクセスせずに使えます。"\nhelpBackupsBody: "設定で「暗号化バックアップをエクスポート」を選び、後からアクセスできる場所に保存します。パスワードは別に保管してください。復元するには、タイマーを停止し、「暗号化バックアップを復元」を選んでパスワードを入力します。適用前に統合案を確認し、競合を解決してください。"\nhelpLocationHistoryBody: "勤務場所の記録設定は、セッション中にClockroveが位置を保存するかどうかを制御します。勤務場所による自動化は別に設定します。アプリ内のGPS地点を消すには位置履歴の削除を使用してください。すでにエクスポートしたコピーは保存先に残ります。"\nhelpBoardsBody: "仕事を開くとボードが表示されます。列にタスクを追加し、進捗に合わせて移動します。ライブラリのタスクを再利用して新しいカードを作成できます。完了した仕事をアーカイブすると、履歴を残したまま進行中の一覧から除外できます。"\nhelpReportsBody: "複数の仕事を確認するにはメインメニューで「レポート」を選ぶか、ボードから仕事のレポートを開きます。合計を確認する前に日付範囲と仕事を選択します。選択したレポートをCSV形式で指定の場所に保存できます。共有前に日付範囲を確認してください。"\nhelpBillingBody: "メインメニューで「見積書」を開き、見積書を作成して内容を確認します。承認されたら、どの作業を仕事に含めるか確認します。請求書を作成する前に顧客、価格、対象の作業を確認します。「請求書」では保存済みPDFの表示と支払いの記録ができます。"\nhelpAutomationBody: "仕事の設定を開き、勤務場所を追加して自動化を有効にします。正確な位置情報と、Androidが要求する場合はバックグラウンドでの位置情報を許可します。到着が検出されない場合は、勤務場所が有効か確認し、表示されていれば監視の更新または再試行を使用してください。監視の準備ができたら、その場所を離れて戻ります。問題の解決中も手動で勤務を開始・終了できます。"\nhelpWidgetsBody: "Androidランチャーのウィジェット選択画面でClockroveウィジェットを追加します。既定の仕事を設定するか、勤務開始時に仕事を選びます。勤務中はタイマーウィジェットに進行中の仕事が表示され、停止もできます。タスク用と統合ウィジェットには設定に応じて今後の作業が表示されます。"\nwidgetSettings: "ウィジェット設定"\nwidgetRetrySettings: "ウィジェット設定を再読み込み"\nretryJobs: "仕事を再読み込み"\nwidgetRefreshJobsFailed: "仕事を更新できませんでした。選択内容と進行中の操作は保持されます。"\nwidgetChooseTaskJobs: "タスク一覧に表示する仕事を選んでください。"\nwidgetChooseDefaultJob: "ワンタップで勤務を開始する既定の仕事を設定するか、毎回仕事を選んでください。"\nwidgetTaskWindow: "期限超過と今後7日間のタスクを表示します。完了済みのタスクとアーカイブ済みの仕事は表示しません。"\nwidgetTimerBehavior: "タイマーには常に進行中の仕事が表示されます。別の仕事を始める前に勤務を終了してください。仕事名をタップすると設定を変更できます。"\nwidgetSelectedJobUnavailable: "選択した仕事を利用できません。有効な仕事を選ぶか、毎回選択してください。"\nwidgetAllJobs: "すべての有効な仕事"\nwidgetChooseEachTime: "毎回選択"\ndone: "完了"\nwidgetSave: "ウィジェットを保存"\nwidgetFinishRetry: "設定を保存しました。「完了」をタップして設定を閉じてください。"\ncommandResultUnknown: "結果を確認できません。閉じる前に同じ操作を再試行して確認してください。"\ncommandRetry: "同じ操作を再試行"\ncommandChangeFailed: "変更を適用できませんでした。下書きは保持されます。詳細を更新して再試行してください。"\ncommandStaleState: "データが変更されました。下書きは保持されます。詳細を更新し、最新の内容を確認して保存し直してください。"\ncommandWidgetUnavailable: "このウィジェットは削除されました。設定を閉じ、ランチャーから新しいウィジェットを追加してください。"\ncommandJobUnavailable: "この仕事は編集できません。"\ncommandInvalidCurrency: "対応する通貨を選んでください。下書きは保持されます。"\ncommandCustomerUnavailable: "この顧客は利用できません。別の顧客を選ぶか、選択を解除してください。"\nkeepEditing: "編集を続ける"\nconfirmReview: "確認を確定"\nchooseSiteCentre: "勤務場所の中心を選択"\narchived: "アーカイブ済み"\nnotNow: "今はしない"\nkeepRecordedTimes: "記録した時刻を保持"\nremoveSite: "勤務場所を削除"\npermanentlyDeleteJob: "仕事を完全に削除"\nallJobs: "すべての仕事"\napply: "適用"\nretryReport: "レポートを再読み込み"\nreviewBilledWork: "請求済みの作業を確認"\nclose: "閉じる"\nsave: "保存"\nsaveSettings: "設定を保存"\narchiveJob: "仕事をアーカイブ"\nreportJobs: "レポートの仕事"\nreportCustomers: "レポートの顧客"\nreportAllCustomers: "すべての顧客"\nreportApplyFilters: "フィルターを適用"\nworkReport: "作業レポート"\nrefreshReport: "レポートを更新"\nreportChangeDates: "日付を変更"\nreportChooseJobs: "仕事を選択"\nbusinessReport: "事業レポート"\nrefreshBusinessReport: "事業レポートを更新"\nretryReportFilters: "レポートのフィルターを再読み込み"\nreportExportCsv: "CSVをエクスポート"\nreportExportPdf: "PDFをエクスポート"\nreportCreateJob: "レポートを見るには仕事を作成してください。"\nreportInvoicedSales: "請求済み売上 · 税抜"\nreportCashReceived: "入金額 · 支払日基準"\nreportTaxBilled: "請求税額"\nreportTaxCollected: "支払い時に受領した税額"\nreportOutstanding: "レポート終了時点の未収金"\nreportLaborCharges: "作業費"\nreportSuppliesCharges: "資材費"\nreportUnclassifiedCharges: "未分類の請求費用"\nreportDirectCosts: "記録済み直接費"\nreportOverhead: "記録済み間接費"\nreportGrossProfit: "推定粗利益"\nreportNetProfit: "推定純利益"\nreportCashSurplus: "推定現金余剰"\nreportAmountUnavailable: "金額を取得できません"\nreportFinalizedTime: "確定済み時間"\nreportNoFinalizedWork: "この選択範囲に確定済みの作業はありません。"\nreportCompletedBillableTasks: "完了済み請求対象タスク"\nreportNoBillableTasks: "この選択範囲に完了済みの請求対象タスクはありません。"\nreportMarginPair: "粗利益率 {gross}% · 純利益率 {net}%"\nreportCostAttribution: "費用の記録：{count}件 · 仕事に未割り当て：{unlinked}件"\nreportInvoiceActivity: "請求書の発行と無効化 · {count}件"\nreportCashEvents: "入金とク