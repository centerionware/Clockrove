helpLocationHistory: "保存した位置履歴を管理する"
helpTimekeepingBody: "仕事を作成し、作業画面からタイマーを開始してください。作業が終わったら停止します。記録を追加したい場合や時刻を修正したい場合は、仕事の履歴を開いてください。手動タイマーは位置情報にアクセスせずに使えます。"
helpBackupsBody: "設定で「暗号化バックアップをエクスポート」を選び、後からアクセスできる場所に保存します。パスワードは別に保管してください。復元するには、タイマーを停止し、「バックアップを復元」を選んで、バックアップが暗号化されている場合のみパスワードを入力します。適用前に統合案を確認し、競合を解決してください。"
helpLocationHistoryBody: "勤務場所の記録設定は、セッション中にClockroveが位置を保存するかどうかを制御します。勤務場所による自動化は別に設定します。アプリ内のGPS地点を消すには位置履歴の削除を使用してください。すでにエクスポートしたコピーは保存先に残ります。"
helpBoardsBody: "仕事を開くとボードが表示されます。列にタスクを追加し、進捗に合わせて移動します。ライブラリのタスクを再利用して新しいカードを作成できます。完了した仕事をアーカイブすると、履歴を残したまま進行中の一覧から除外できます。"
helpReportsBody: "複数の仕事を確認するにはメインメニューで「レポート」を選ぶか、ボードから仕事のレポートを開きます。合計を確認する前に日付範囲と仕事を選択します。選択したレポートをCSV形式で指定の場所に保存できます。共有前に日付範囲を確認してください。"
helpBillingBody: "メインメニューで「見積書」を開き、見積書を作成して内容を確認します。承認されたら、どの作業を仕事に含めるか確認します。請求書を作成する前に顧客、価格、対象の作業を確認します。「請求書」では保存済みPDFの表示と支払いの記録ができます。"
helpAutomationBody: "仕事の設定を開き、勤務場所を追加して自動化を有効にします。正確な位置情報と、Androidが要求する場合はバックグラウンドでの位置情報を許可します。到着が検出されない場合は、勤務場所が有効か確認し、表示されていれば監視の更新または再試行を使用してください。監視の準備ができたら、その場所を離れて戻ります。問題の解決中も手動で勤務を開始・終了できます。 到着時の勤務開始が有効な状態で現在地に勤務場所を保存すると、Clockrove は今すぐ勤務を開始するか確認します。その場所にいる間に変更を保存すると到着検出がリセットされ、退出と再入場が確認されると再開します。Android は半径 100～150 m を推奨しており、それより小さいと到着を検出できないことがあります。"
helpWidgetsBody: "Androidランチャーのウィジェット選択画面でClockroveウィジェットを追加します。既定の仕事を設定するか、勤務開始時に仕事を選びます。勤務中はタイマーウィジェットに進行中の仕事が表示され、停止もできます。タスク用と統合ウィジェットには設定に応じて今後の作業が表示されます。"
