helpLocationHistory: "Gérer l’historique de localisation enregistré"
helpTimekeepingBody: "Créez un chantier puis démarrez son chronomètre depuis l’écran de travail. Arrêtez-le à la fin. Utilisez l’historique du chantier pour ajouter une saisie oubliée ou corriger les horaires. Le chronomètre manuel fonctionne sans accès à la position."
helpBackupsBody: "Dans Paramètres, sélectionnez Exporter une sauvegarde chiffrée et enregistrez le fichier dans un emplacement accessible. Conservez le mot de passe séparément. Pour restaurer, arrêtez le chronomètre, sélectionnez Restaurer une sauvegarde chiffrée et saisissez le mot de passe. Vérifiez la fusion proposée et résolvez les conflits avant de l’appliquer."
helpLocationHistoryBody: "La localisation au travail détermine si Clockrove enregistre les positions pendant une session. L’automatisation a son propre réglage. Utilisez la commande de suppression de l’historique pour effacer les points GPS de l’application. Les copies déjà exportées restent à leur destination."
helpBoardsBody: "Ouvrez un chantier pour afficher son tableau. Ajoutez une tâche à une colonne et déplacez-la selon son avancement. Réutilisez une tâche de la bibliothèque pour créer une carte. Archivez un chantier terminé pour le retirer des listes actives tout en conservant son historique."
helpReportsBody: "Ouvrez Rapports dans le menu principal pour consulter plusieurs chantiers ou ouvrez le rapport d’un chantier depuis son tableau. Choisissez la période et les chantiers avant de vérifier les totaux. Exportez le rapport en CSV vers la destination choisie. Vérifiez la période avant de le partager."
helpBillingBody: "Ouvrez Devis dans le menu principal pour préparer et vérifier un devis. Après acceptation, vérifiez les travaux à rattacher au chantier. Vérifiez le client, les prix et les travaux inclus avant de préparer une facture. Ouvrez Factures pour consulter le PDF enregistré et saisir les paiements."
helpAutomationBody: "Ouvrez les paramètres d’un chantier pour ajouter un lieu de travail et activer l’automatisation. Autorisez la localisation précise et, si Android le demande, la localisation en arrière-plan. Si une arrivée n’est pas détectée, vérifiez que le lieu est activé et utilisez l’option d’actualisation ou de nouvelle tentative de surveillance si elle apparaît. Une fois la surveillance prête, quittez le lieu puis revenez. Vous pouvez pointer manuellement pendant le dépannage."
helpWidgetsBody: "Ouvrez le sélecteur de widgets du lanceur Android et ajoutez un widget Clockrove. Choisissez un chantier par défaut ou sélectionnez-en un au pointage. Pendant le travail, le widget chronomètre affiche le chantier actif et peut l’arrêter. Les widgets de tâches et combinés affichent le travail à venir selon leur configuration."
