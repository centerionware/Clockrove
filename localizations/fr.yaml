CountNote: "Ce total compte les marques de suppression de la sauvegarde, pas tous les enregistrements concernés."\nrestoreCancelled: "Aperçu annulé. Aucun enregistrement local n’a été modifié."\nrestoreCleanupFailed: "Impossible de supprimer les données temporaires de restauration. Fermez puis rouvrez Clockrove avant de réessayer."\nrestoreFailed: "Impossible de traiter la sauvegarde. Vérifiez le fichier sélectionné et réessayez."\nrestoreUnlockFailed: "Impossible de déverrouiller la sauvegarde. Vérifiez le mot de passe et le fichier."\nrestoreAllConflictsReviewed: "Toutes les pages de conflits ont été examinées. L’application vérifie la version locale et enregistre tous les choix dans une transaction."\nhelp: "Aide"\nhelpSearch: "Rechercher dans l’aide"\nhelpNoResults: "Aucune rubrique d’aide correspondante."\nhelpVersion: "Version de Clockrove {version}"\nhelpWith: "Aide sur {topic}"\nhelpTimekeeping: "Démarrer et vérifier le travail"\nhelpAutomation: "Localisation et automatisation par lieu de travail"\nhelpBackups: "Sauvegarder et restaurer vos données"\nhelpBoards: "Organiser les chantiers et les tâches"\nhelpReports: "Créer des rapports et exporter un CSV"\nhelpBilling: "Préparer des devis et des factures"\nhelpWidgets: "Utiliser le widget de l’écran d’accueil Android"\nhelpLocationHistory: "Gérer l’historique de localisation enregistré"\nhelpTimekeepingBody: "Créez un chantier puis démarrez son chronomètre depuis l’écran de travail. Arrêtez-le à la fin. Utilisez l’historique du chantier pour ajouter une saisie oubliée ou corriger les horaires. Le chronomètre manuel fonctionne sans accès à la position."\nhelpBackupsBody: "Dans Paramètres, sélectionnez Exporter une sauvegarde chiffrée et enregistrez le fichier dans un emplacement accessible. Conservez le mot de passe séparément. Pour restaurer, arrêtez le chronomètre, sélectionnez Restaurer une sauvegarde chiffrée et saisissez le mot de passe. Vérifiez la fusion proposée et résolvez les conflits avant de l’appliquer."\nhelpLocationHistoryBody: "La localisation au travail détermine si Clockrove enregistre les positions pendant une session. L’automatisation a son propre réglage. Utilisez la commande de suppression de l’historique pour effacer les points GPS de l’application. Les copies déjà exportées restent à leur destination."\nhelpBoardsBody: "Ouvrez un chantier pour afficher son tableau. Ajoutez une tâche à une colonne et déplacez-la selon son avancement. Réutilisez une tâche de la bibliothèque pour créer une carte. Archivez un chantier terminé pour le retirer des listes actives tout en conservant son historique."\nhelpReportsBody: "Ouvrez Rapports dans le menu principal pour consulter plusieurs chantiers ou ouvrez le rapport d’un chantier depuis son tableau. Choisissez la période et les chantiers avant de vérifier les totaux. Exportez le rapport en CSV vers la destination choisie. Vérifiez la période avant de le partager."\nhelpBillingBody: "Ouvrez Devis dans le menu principal pour préparer et vérifier un devis. Après acceptation, vérifiez les travaux à rattacher au chantier. Vérifiez le client, les prix et les travaux inclus avant de préparer une facture. Ouvrez Factures pour consulter le PDF enregistré et saisir les paiements."\nhelpAutomationBody: "Ouvrez les paramètres d’un chantier pour ajouter un lieu de travail et activer l’automatisation. Autorisez la localisation précise et, si Android le demande, la localisation en arrière-plan. Si une arrivée n’est pas détectée, vérifiez que le lieu est activé et utilisez l’option d’actualisation ou de nouvelle tentative de surveillance si elle apparaît. Une fois la surveillance prête, quittez le lieu puis revenez. Vous pouvez pointer manuellement pendant le dépannage."\nhelpWidgetsBody: "Ouvrez le sélecteur de widgets du lanceur Android et ajoutez un widget Clockrove. Choisissez un chantier par défaut ou sélectionnez-en un au pointage. Pendant le travail, le widget chronomètre affiche le chantier actif et peut l’arrêter. Les widgets de tâches et combinés affichent le travail à venir selon leur configuration."\nwidgetSettings: "Paramètres du widget"\nwidgetRetrySettings: "Recharger les paramètres du widget"\nretryJobs: "Recharger les chantiers"\nwidgetRefreshJobsFailed: "Impossible d’actualiser les chantiers. Votre sélection et l’opération en cours sont conservées."\nwidgetChooseTaskJobs: "Choisissez les chantiers qui figurent dans la liste des tâches."\nwidgetChooseDefaultJob: "Choisissez un chantier par défaut pour pointer en un geste ou choisissez-le à chaque fois."\nwidgetTaskWindow: "Tâches en retard et des 7 prochains jours calendaires. Les tâches terminées et les chantiers archivés sont masqués."\nwidgetTimerBehavior: "Le chronomètre indique toujours le chantier en cours. Pointez le départ avant de démarrer un autre chantier. Touchez le nom du chantier pour modifier ces paramètres."\nwidgetSelectedJobUnavailable: "Le chantier sélectionné est indisponible. Choisissez un chantier actif ou choisissez à chaque fois."\nwidgetAllJobs: "Tous les chantiers actifs"\nwidgetChooseEachTime: "Choisir à chaque fois"\ndone: "Terminé"\nwidgetSave: "Enregistrer le widget"\nwidgetFinishRetry: "Paramètres enregistrés. Touchez Terminé pour fermer la configuration du widget."\ncommandResultUnknown: "Le résultat est inconnu. Relancez la même opération pour le vérifier avant de quitter."\ncommandRetry: "Réessayer la même opération"\ncommandChangeFailed: "Impossible d’appliquer la modification. Votre brouillon est conservé. Actualisez les détails et réessayez."\ncommandStaleState: "Les données ont changé. Votre brouillon est conservé. Actualisez les détails, vérifiez les nouvelles valeurs et enregistrez de nouveau."\ncommandWidgetUnavailable: "Ce widget a été supprimé. Fermez la configuration et ajoutez un nouveau widget depuis le lanceur."\ncommandJobUnavailable: "Ce chantier ne peut pas être modifié."\ncommandInvalidCurrency: "Choisissez une devise prise en charge. Votre brouillon est conservé."\ncom