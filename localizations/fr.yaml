iles de carte chargées"\nopenMap: "Ouvrir la carte"\nmapSettingsRetry: "Impossible de charger les paramètres de la carte. Réessayez."\nlastLocationSample: "Dernier relevé le {date} à {time}"\nlocationAccuracy: "Précision : {meters} m"\nlocationTitle: "Position de travail"\nlocationPurpose: "Enregistre la position uniquement pendant le pointage, avec un relevé prévu toutes les dix minutes environ. La précision et le délai réel varient. Le pointage manuel fonctionne sans autorisation de localisation. Cette option n’active pas l’automatisation par zone en arrière-plan."\ncontinueLabel: "Continuer"\nenableLocation: "Activer la localisation au travail"\ndisableLocation: "Arrêter uniquement la localisation"\nallowNotifications: "Autoriser les notifications"\nlocationIdle: "Aucune position enregistrée en dehors du pointage."\nlocationDenied: "Autorisation de localisation refusée. Le chronomètre manuel reste utilisable."\nlocationRestricted: "Position indisponible ou restreinte. Le chronomètre manuel reste utilisable."\nlocationRequesting: "Position demandée. Un relevé toutes les dix minutes est prévu."\nlocationStarting: "Démarrage de la localisation au travail…"\nlocationRecordingDisabled: "La localisation au travail est désactivée dans les paramètres ou pour ce chantier. Le chronomètre fonctionne indépendamment."\nlocationUnavailable: "En attente de la position. L’absence de signal GPS ne met pas fin au travail."\nlocationStopped: "La localisation au travail est arrêtée. Le chronomètre fonctionne indépendamment."\nlocationApproximate: "Seule la position approximative est autorisée. La précision est limitée."\nappName: "Clockrove"\nbackupPassword: "Mot de passe de la sauvegarde"\nconfirmPassword: "Confirmer le mot de passe"\nhidePassword: "Masquer le mot de passe"\nshowPassword: "Afficher le mot de passe"\ncreateEncryptedBackup: "Créer une sauvegarde chiffrée"\nchooseEncryptedBackup: "Choisir une sauvegarde chiffrée"\nchooseAnotherBackup: "Choisir une autre sauvegarde"\nc