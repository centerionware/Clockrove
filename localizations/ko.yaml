helpBackupsBody: "설정에서 암호화된 백업 내보내기를 선택하고 나중에 열 수 있는 곳에 파일을 저장하세요. 비밀번호는 따로 보관하세요. 복원하려면 타이머를 중지하고 암호화된 백업 복원을 선택한 뒤 비밀번호를 입력하세요. 적용하기 전에 제안된 병합 내용을 확인하고 충돌을 해결하세요."
helpLocationHistoryBody: "근무 위치 기록 설정은 세션 중에 Clockrove가 위치를 저장할지 결정합니다. 근무지 자동화에는 별도 설정이 있습니다. 위치 기록 삭제 기능으로 앱에 저장된 GPS 지점을 삭제할 수 있습니다. 이미 내보낸 사본은 저장 위치에 남습니다."
helpBoardsBody: "작업을 열어 보드를 보세요. 열에 할 일을 추가하고 진행 상황에 따라 이동하세요. 라이브러리의 할 일을 재사용해 새 카드를 만들 수 있습니다. 끝난 작업을 보관하면 기록은 유지하면서 활성 목록에서 제거할 수 있습니다."
helpReportsBody: "여러 작업을 확인하려면 기본 메뉴에서 보고서를 선택하거나 보드에서 작업 보고서를 여세요. 합계를 보기 전에 날짜 범위와 작업을 선택하세요. 선택한 보고서를 원하는 위치에 CSV 파일로 내보낼 수 있습니다. 공유하기 전에 날짜 범위를 확인하세요."
helpBillingBody: "기본 메뉴에서 견적서를 열어 작성하고 검토하세요. 승인되면 어떤 작업을 포함할지 확인하세요. 청구서를 작성하기 전에 고객, 가격, 포함된 작업을 확인하세요. 청구서에서 저장된 PDF를 보고 결제를 기록할 수 있습니다."
helpAutomationBody: "작업 설정을 열어 근무지를 추가하고 자동화를 켜세요. 정확한 위치를 허용하고 Android에서 요구하는 경우 백그라운드 위치도 허용하세요. 도착이 감지되지 않으면 근무지가 활성화되어 있는지 확인하고, 표시되는 경우 모니터링 새로고침 또는 재시도 옵션을 사용하세요. 모니터링 준비가 끝나면 근무지를 떠났다 돌아오세요. 문제를 해결하는 동안 수동으로 근무를 시작하거나 종료할 수 있습니다."
helpWidgetsBody: "Android 런처의 위젯 선택 화면에서 Clockrove 위젯을 추가하세요. 기본 작업을 고르거나 근무를 시작할 때 작업을 선택하세요. 근무 중에는 타이머 위젯이 활성 작업을 표시하고 타이머를 중지할 수 있습니다. 할 일 위젯과 통합 위젯은 설정에 따라 예정된 작업을 표시합니다."
