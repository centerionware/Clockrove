restoreChooseAndProtect: "Clockrove-এর ব্যাকআপ বেছে নিন। এনক্রিপ্ট করা হলে পাসওয়ার্ড দিন; এনক্রিপ্ট না করা ব্যাকআপ পাসওয়ার্ড ছাড়াই পুনরুদ্ধার করা যায়। ফাইলটি ব্যক্তিগত এনক্রিপ্ট করা অস্থায়ী স্থানে পড়া হয়। পাসওয়ার্ড সংরক্ষণ করা হয় না এবং Clockrove এটি উদ্ধার করতে পারে না।"
