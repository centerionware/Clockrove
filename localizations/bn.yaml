helpTimekeepingBody: "একটি কাজ তৈরি করুন এবং কাজের স্ক্রিন থেকে টাইমার চালু করুন। শেষ হলে টাইমার বন্ধ করুন। বাদ পড়া এন্ট্রি যোগ করতে বা সময় ঠিক করতে কাজের ইতিহাস ব্যবহার করুন। অবস্থানের অনুমতি ছাড়াও ম্যানুয়াল টাইমার চলে।"
helpBackupsBody: "সেটিংসে এনক্রিপ্ট করা ব্যাকআপ রপ্তানি করুন বেছে নিন এবং ফাইলটি পরে পাওয়া যাবে এমন স্থানে রাখুন। পাসওয়ার্ড আলাদা রাখুন। পুনরুদ্ধার করতে টাইমার বন্ধ করুন, এনক্রিপ্ট করা ব্যাকআপ পুনরুদ্ধার করুন বেছে নিন এবং পাসওয়ার্ড দিন। প্রয়োগের আগে প্রস্তাবিত মার্জ দেখুন ও সব দ্বন্দ্ব মেটান।"
helpLocationHistoryBody: "কাজের অবস্থান রেকর্ডের সেটিং নির্ধারণ করে সেশন চলাকালে Clockrove অবস্থান সংরক্ষণ করবে কি না। অবস্থানভিত্তিক অটোমেশনের আলাদা সেটিং আছে। অ্যাপ থেকে সংরক্ষিত GPS পয়েন্ট মুছতে অবস্থানের ইতিহাস মুছুন। আগে রপ্তানি করা কপি তার গন্তব্যে থাকবে।"
helpBoardsBody: "বোর্ড দেখতে একটি কাজ খুলুন। কোনো কলামে একটি কাজ যোগ করুন এবং অগ্রগতির সঙ্গে সরানোর বিকল্প ব্যবহার করুন। নতুন কার্ডের জন্য লাইব্রেরির কাজ পুনরায় ব্যবহার করুন। শেষ হওয়া কাজের ইতিহাস রেখে সক্রিয় তালিকা থেকে সরাতে সেটি আর্কাইভ করুন।"
helpReportsBody: "একাধিক কাজের জন্য প্রধান মেনুর প্রতিবেদন খুলুন, অথবা বোর্ড থেকে কাজের প্রতিবেদন খুলুন। মোট দেখার আগে তারিখের সীমা ও কাজ বেছে নিন। নির্বাচিত প্রতিবেদন পছন্দের গন্তব্যে CSV হিসেবে রপ্তানি করুন। শেয়ার করার আগে তারিখের সীমা যাচাই করুন।"
helpBillingBody: "মূল মেনুতে মূল্যপ্রস্তাব খুলে একটি প্রস্তাব তৈরি ও পর্যালোচনা করুন। গৃহীত হলে প্রকল্পে কোন কাজ অন্তর্ভুক্ত হবে দেখুন। চালান তৈরির আগে গ্রাহক, মূল্য এবং অন্তর্ভুক্ত কাজ যাচাই করুন। সেভ করা PDF দেখতে ও পেমেন্ট লিখতে চালান খুলুন।"
helpAutomationBody: "কাজের সেটিংস খুলে কর্মস্থল যোগ করুন ও অটোমেশন চালু করুন। সঠিক অবস্থানের অনুমতি দিন এবং Android চাইলে পটভূমিতে অবস্থানের অনুমতিও দিন। আগমন ধরা না পড়লে কর্মস্থল চালু আছে কি না দেখুন এবং নজরদারি হালনাগাদ বা আবার চেষ্টার বিকল্প থাকলে ব্যবহার করুন। নজরদারি প্রস্তুত হলে স্থান ছেড়ে আবার ফিরুন। সমস্যা সমাধানের সময় নিজেই কাজের সময় গণনা শুরু বা বন্ধ করতে পারেন।"
helpWidgetsBody: "Android লঞ্চারের উইজেট পিকার খুলে Clockrove উইজেট যোগ করুন। একটি ডিফল্ট কাজ বেছে নিন বা সময় গণনা শুরুর সময় কাজ বেছে নিন। কাজ চলার সময় টাইমার উইজেট সক্রিয় কাজটি দেখায় এবং সেটি থামাতে পারে। টাস্ক ও সম্মিলিত উইজেট তাদের সেটিংস অনুযায়ী আসন্ন কাজ দেখায়।"
