autoBackupTitle: "Sao lưu tự động"
autoBackupHelp: "Clockrove lưu bản sao lưu khoảng một lần mỗi ngày khi ứng dụng đã đóng, nếu Android cho phép. Giới hạn pin, buộc dừng hoặc ngoại tuyến có thể làm chậm."
autoBackupPlan: "Giữ 7 bản hằng ngày, 4 hằng tuần, 12 hằng tháng và hằng năm. Các tệp tự động cũ bị xóa sau mỗi lần chạy thành công."
