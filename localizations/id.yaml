helpBilling: "Siapkan penawaran dan faktur"
helpWidgets: "Gunakan widget layar utama Android"
helpLocationHistory: "Kelola riwayat lokasi tersimpan"
helpTimekeepingBody: "Buat pekerjaan lalu mulai pencatat waktunya dari layar kerja. Hentikan saat selesai. Gunakan riwayat pekerjaan untuk menambahkan entri yang terlewat atau memperbaiki waktu. Pencatat waktu manual berfungsi tanpa akses lokasi."
helpBackupsBody: "Di Setelan, pilih Ekspor cadangan terenkripsi dan simpan file di tempat yang dapat diakses lagi. Simpan kata sandi secara terpisah. Untuk memulihkan, hentikan pencatat waktu, pilih Pulihkan cadangan terenkripsi, lalu masukkan kata sandi. Tinjau usulan penggabungan dan selesaikan konflik sebelum menerapkan."
helpLocationHistoryBody: "Setelan lokasi kerja menentukan apakah Clockrove menyimpan lokasi selama sesi. Otomatisasi tempat kerja memiliki setelan terpisah. Gunakan kontrol penghapusan riwayat lokasi untuk menghapus titik GPS tersimpan dari aplikasi. Salinan yang sudah diekspor tetap di lokasi tujuannya."
helpBoardsBody: "Buka pekerjaan untuk melihat papannya. Tambahkan tugas ke kolom dan pindahkan tugas saat pekerjaan berjalan. Gunakan kembali tugas dari pustaka untuk membuat kartu baru. Arsipkan pekerjaan yang selesai agar hilang dari daftar aktif dengan tetap menyimpan riwayatnya."
helpReportsBody: "Pilih Laporan dari menu utama untuk melihat beberapa pekerjaan, atau buka laporan pekerjaan dari papan. Pilih rentang tanggal dan pekerjaan sebelum meninjau total. Ekspor laporan ke CSV di lokasi pilihan Anda. Tinjau rentang tanggal sebelum membagikannya."
helpBillingBody: "Buka Penawaran dari menu utama untuk menyiapkan dan meninjau penawaran. Setelah diterima, tinjau pekerjaan yang perlu disertakan. Periksa pelanggan, harga, dan cakupan pekerjaan sebelum menyiapkan faktur. Buka Faktur untuk melihat PDF tersimpan dan mencatat pembayaran."
helpAutomationBody: "Buka setelan pekerjaan untuk menambahkan lokasi kerja dan mengaktifkan otomatisasi. Izinkan lokasi presisi dan, jika Android memerlukannya, lokasi di latar belakang. Jika kedatangan tidak terdeteksi, periksa apakah lokasi aktif dan gunakan opsi muat ulang atau coba lagi pemantauan jika muncul. Setelah siap, tinggalkan lokasi lalu kembali. Anda dapat memulai atau mengakhiri pencatatan waktu secara manual saat mengatasi masalah."
helpWidgetsBody: "Buka pemilih widget peluncur Android dan tambahkan widget Clockrove. Pilih pekerjaan bawaan atau pilih pekerjaan saat mulai mencatat waktu. Saat bekerja, widget timer menampilkan pekerjaan aktif dan dapat menghentikannya. Widget tugas dan gabungan menampilkan pekerjaan mendatang sesuai konfigurasinya."
