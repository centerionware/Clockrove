ancelled: "Vorschau abgebrochen. Lokale Datensätze wurden nicht geändert."\nrestoreCleanupFailed: "Die temporären Wiederherstellungsdaten konnten nicht entfernt werden. Schließe und öffne Clockrove vor einem neuen Versuch."\nrestoreFailed: "Die Sicherung konnte nicht verarbeitet werden. Prüfe die ausgewählte Datei und versuche es erneut."\nrestoreUnlockFailed: "Die Sicherung konnte nicht entsperrt werden. Prüfe Passwort und Datei."\nrestoreAllConflictsReviewed: "Alle Konfliktseiten wurden geprüft. Beim Anwenden wird die lokale Version geprüft und die Auswahl in einer Transaktion gespeichert."\nhelp: "Hilfe"\nhelpSearch: "Hilfe durchsuchen"\nhelpNoResults: "Keine passenden Hilfethemen."\nhelpVersion: "Clockrove-Version {version}"\nhelpWith: "Hilfe zu {topic}"\nhelpTimekeeping: "Arbeit starten und prüfen"\nhelpAutomation: "Standort und Arbeitsort-Automatisierung"\nhelpBackups: "Datensätze sichern und wiederherstellen"\nhelpBoards: "Aufträge und Aufgaben organisieren"\nhelpReports: "Berichte erstellen und CSV exportieren"\nhelpBilling: "Angebote und Rechnungen vorbereiten"\nhelpWidgets: "Android-Startbildschirm-Widget verwenden"\nhelpLocationHistory: "Gespeicherten Standortverlauf verwalten"\nhelpTimekeepingBody: "Erstelle einen Auftrag und starte seinen Timer in der Arbeitsansicht. Stoppe den Timer, wenn du fertig bist. Ergänze vergessene Einträge oder korrigiere Zeiten im Arbeitsverlauf des Auftrags. Der manuelle Timer funktioniert ohne Standortzugriff."\nhelpBackupsBody: "Wähle in den Einstellungen „Verschlüsselte Sicherung exportieren“ und speichere die Datei an einem Ort, den du später erreichst. Bewahre das Passwort separat auf. Stoppe zur Wiederherstellung den Timer, wähle „Verschlüsselte Sicherung wiederherstellen“ und gib das Passwort ein. Prüfe die Zusammenführung und löse Konflikte vor dem Anwenden."\nhelpLocationHistoryBody: "Die Arbeitsorterfassung bestimmt, ob Clockrove während einer Sitzung Standorte speichert. Die Automatisierung hat eine eigene Einstellung. Lösche gespeicherte GPS-Punkte über den Standortverlauf. Bereits exportierte Kopien bleiben am Zielort."\nhelpBoardsBody: "Öffne einen Auftrag, um seine Tafel zu sehen. Füge einer Spalte eine Aufgabe hinzu und verschiebe sie bei Fortschritt. Verwende eine Aufgabe aus der Bibliothek als Vorlage für eine neue Karte. Archiviere abgeschlossene Aufträge, um sie aus aktiven Listen zu entfernen und ihren Verlauf zu behalten."\nhelpReportsBody: "Wähle im Hauptmenü Berichte für mehrere Aufträge oder öffne den Auftragsbericht von der Tafel aus. Wähle Zeitraum und Aufträge, bevor du die Summen prüfst. Exportiere den Bericht als CSV an den gewünschten Zielort. Prüfe den Zeitraum vor dem Teilen."\nhelpBillingBody: "Öffne Angebote im Hauptmenü, um ein Angebot vorzubereiten und zu prüfen. Prüfe nach der Annahme, welche Arbeiten zum Auftrag gehören. Kontrolliere vor der Rechnung den Kunden, die Preise und die enthaltenen Leistungen. Unter Rechnungen kannst du gespeicherte PDFs öffnen und Zahlungen erfassen."\nhelpAutomationBody: "Öffne die Auftragseinstellungen, um einen Arbeitsort hinzuzufügen und die Automatisierung zu aktivieren. Erlaube den genauen Standort und, wenn Android es verlangt, den Standort im Hintergrund. Wenn eine Ankunft fehlt, prüfe, ob der Arbeitsort aktiviert ist, und aktualisiere oder starte die Überwachung erneut, falls die Option angezeigt wird. Sobald die Überwachung bereit ist, verlasse den Ort und kehre zurück. Während der Fehlersuche kannst du manuell ein- und ausstempeln."\nhelpWidgetsBody: "Öffne die Widget-Auswahl des Android-Startbildschirms und füge ein Clockrove-Widget hinzu. Wähle einen Standardauftrag oder wähle den Auftrag beim Einstempeln aus. Während der Arbeit zeigt das Timer-Widget den aktiven Auftrag und kann ihn stoppen. Aufgaben- und Kombi-Widgets zeigen anstehende Arbeiten gemäß ihrer Konfiguration."\nwidgetSettings: "Widget-Einstellungen"\nwidgetRetrySettings: "Widget-Einstellungen erneut laden"\nretryJobs: "Aufträge erneut laden"\