helpTimekeepingBody: "Создайте работу и запустите таймер на рабочем экране. Остановите таймер по завершении. В истории работы можно добавить пропущенную запись или исправить время. Ручной таймер работает без доступа к местоположению."
helpBackupsBody: "В настройках выберите «Экспортировать зашифрованную резервную копию» и сохраните файл в доступном месте. Храните пароль отдельно. Для восстановления остановите таймер, выберите «Восстановить зашифрованную резервную копию» и введите пароль. Проверьте предложенное объединение и разрешите конфликты перед применением."
helpLocationHistoryBody: "Настройка записи местоположения определяет, сохраняет ли Clockrove координаты во время сессии. У автоматизации отдельная настройка. Удалите сохранённые точки GPS через команду удаления истории местоположений. Уже экспортированные копии останутся в месте сохранения."
helpBoardsBody: "Откройте работу, чтобы увидеть её доску. Добавьте задачу в столбец и перемещайте её по мере выполнения. Используйте задачу из библиотеки как основу новой карточки. Архивируйте завершённую работу, чтобы убрать её из активных списков и сохранить историю."
helpReportsBody: "Выберите «Отчёты» в главном меню для просмотра нескольких работ или откройте отчёт с доски работы. Выберите даты и работы, прежде чем проверять итоги. Экспортируйте отчёт в CSV в нужную папку. Проверьте даты перед отправкой."
helpBillingBody: "Откройте «Сметы» в главном меню, чтобы подготовить и проверить смету. После принятия уточните, какие услуги относятся к работе. Перед подготовкой счёта проверьте клиента, цены и включённые услуги. В разделе «Счета» можно открыть сохранённый PDF и записать платежи."
helpAutomationBody: "Откройте настройки работы, добавьте рабочую зону и включите автоматизацию. Разрешите точное местоположение и, если Android требует, доступ в фоновом режиме. Если прибытие не обнаружено, убедитесь, что зона включена, и воспользуйтесь обновлением или повторным запуском мониторинга, если этот пункт доступен. Когда мониторинг будет готов, выйдите из зоны и вернитесь. Во время проверки можно запускать и останавливать таймер вручную."
helpWidgetsBody: "Откройте выбор виджетов Android и добавьте виджет Clockrove. Укажите работу по умолчанию или выбирайте её при запуске таймера. Во время работы виджет таймера показывает активную работу и может остановить её. Виджеты задач и комбинированные виджеты показывают предстоящие работы согласно настройкам."
