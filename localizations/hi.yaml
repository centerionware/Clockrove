helpLocationHistory: "सेव किए गए स्थान का इतिहास नियंत्रित करें"
helpTimekeepingBody: "नया काम बनाएँ और काम की स्क्रीन से उसका टाइमर शुरू करें। काम पूरा होने पर टाइमर बंद करें। छूटी हुई एंट्री जोड़ने या समय ठीक करने के लिए काम का इतिहास खोलें। मैन्युअल टाइमर स्थान की अनुमति के बिना चलता है।"
helpBackupsBody: "सेटिंग्स में एन्क्रिप्ट किया गया बैकअप एक्सपोर्ट करें चुनें और फ़ाइल ऐसी जगह सेव करें जहाँ बाद में मिल सके। पासवर्ड अलग रखें। बहाल करने से पहले टाइमर रोकें, एन्क्रिप्ट किया गया बैकअप वापस लाएँ चुनें और पासवर्ड डालें। सुझाए गए मर्ज को जाँचें और लागू करने से पहले टकराव सुलझाएँ।"
helpLocationHistoryBody: "काम के स्थान की रिकॉर्डिंग तय करती है कि सत्र के दौरान Clockrove स्थान सेव करेगा या नहीं। कार्यस्थल ऑटोमेशन की अलग सेटिंग है। ऐप से GPS बिंदु हटाने के लिए स्थान का इतिहास मिटाएँ। पहले एक्सपोर्ट की गई कॉपियाँ अपनी जगह पर रहती हैं।"
helpBoardsBody: "काम का बोर्ड देखने के लिए उसे खोलें। किसी कॉलम में कार्य जोड़ें और प्रगति के साथ उसे स्थानांतरित करें। नया कार्ड बनाने के लिए लाइब्रेरी का कार्य फिर इस्तेमाल करें। पूरा काम आर्काइव करने से वह सक्रिय सूची से हट जाएगा और इतिहास सुरक्षित रहेगा।"
helpReportsBody: "अलग-अलग कामों के लिए मुख्य मेनू में रिपोर्ट चुनें, या बोर्ड से काम की रिपोर्ट खोलें। कुल देखने से पहले तारीखों की सीमा और काम चुनें। चुनी हुई रिपोर्ट CSV में अपनी पसंद की जगह एक्सपोर्ट करें। शेयर करने से पहले तारीखें जाँचें।"
helpBillingBody: "मूल्य प्रस्ताव तैयार करने और उसकी समीक्षा के लिए मुख्य मेनू में मूल्य प्रस्ताव खोलें। स्वीकार होने पर देखें कि कौन-सा काम शामिल है। चालान बनाने से पहले ग्राहक, कीमतें और शामिल काम जाँचें। सेव किया गया PDF देखने और भुगतान दर्ज करने के लिए चालान खोलें।"
helpAutomationBody: "कार्यस्थल जोड़ने और ऑटोमेशन चालू करने के लिए काम की सेटिंग्स खोलें। सटीक स्थान की अनुमति दें और Android की माँग पर बैकग्राउंड स्थान की अनुमति भी दें। अगर पहुँचना दर्ज न हो, तो देखें कि कार्यस्थल चालू है और मॉनिटरिंग रीफ़्रेश करने या फिर कोशिश करने का विकल्प दिखे तो उसका इस्तेमाल करें। मॉनिटरिंग तैयार हो जाए तो कार्यस्थल से बाहर निकलकर वापस आएँ। समस्या सुलझाते समय आप मैन्युअल रूप से समय शुरू या बंद कर सकते हैं।"
helpWidgetsBody: "Android लॉन्चर का विजेट पिकर खोलें और Clockrove विजेट जोड़ें। डिफ़ॉल्ट काम चुनें या समय दर्ज करना शुरू करते समय काम चुनें। काम के दौरान टाइमर विजेट चालू काम दिखाता है और उसे रोक सकता है। कार्य और संयुक्त विजेट अपने सेटअप के अनुसार आगामी काम दिखाते हैं।"
